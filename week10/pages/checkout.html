<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>Open Fashion — Checkout</title>
</head>

<body>
    <div class="container checkout">

        <!-- Header -->
        <header class="header plain">
            <a href="product.html" class="icon-btn" aria-label="menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="#14142B" stroke-width="1">
                    <line x1="3" y1="7" x2="21" y2="7" /><line x1="3" y1="12" x2="13" y2="12" /><line x1="3" y1="17" x2="21" y2="17" />
                </svg>
            </a>
            <a href="home.html" class="logo"><img src="../assets/src/img/logo.png" alt="Open Fashion"></a>
            <div class="right">
                <a href="search.html" class="icon-btn" aria-label="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#14142B" stroke-width="1"><circle cx="11" cy="11" r="7" /><line x1="16" y1="16" x2="21" y2="21" /></svg>
                </a>
                <a href="checkout.html" class="icon-btn" aria-label="bag">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#14142B" stroke-width="1"><path d="M5 8h14l-1 13H6L5 8z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></svg>
                </a>
            </div>
        </header>

        <h2 class="checkout-title">Checkout</h2>

        <!-- Cart item -->
        <div class="cart-item">
            <div class="ci-thumb"><img src="../assets/src/img/20.png" alt=""></div>
            <div class="ci-info">
                <p class="brand">LAMEREI</p>
                <p class="title">Recycle Boucle Knit Cardigan Pink</p>
                <div class="qty">
                    <button class="minus">−</button>
                    <span>1</span>
                    <button class="plus">+</button>
                </div>
                <p class="price">$120</p>
            </div>
        </div>

        <div class="ck-line"></div>

        <button class="promo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.2"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 6 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-6z"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            Add promo code
        </button>

        <div class="ck-line"></div>

        <div class="ck-row">
            <span class="lbl">
                <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.2"><rect x="3" y="7" width="13" height="10"/><path d="M16 10h3l2 3v4h-5z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
                Delivery
            </span>
            <span class="val">Free</span>
        </div>

        <div class="ck-line"></div>

        <div class="ck-row total">
            <span class="lbl">Total</span>
            <span class="val">$120</span>
        </div>

        <!-- Checkout bar -->
        <a href="#" class="checkout-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2"><path d="M5 8h14l-1 13H6L5 8z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></svg>
            Checkout
        </a>

    </div>
</body>

</html>
